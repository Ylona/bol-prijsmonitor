name: Prijs aanpassen op bol.com

on:
  workflow_dispatch:
    inputs:
      wijzigingen:
        description: 'JSON-array met prijswijzigingen'
        required: true
      land:
        description: 'Land (NL of BE)'
        required: false
        default: 'NL'

jobs:
  aanpassen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Prijzen aanpassen NL
        if: ${{ github.event.inputs.land == 'NL' || github.event.inputs.land == '' }}
        env:
          COUNTRY: NL
          BOL_CLIENT_ID_NL: ${{ secrets.BOL_CLIENT_ID_NL }}
          BOL_CLIENT_SECRET_NL: ${{ secrets.BOL_CLIENT_SECRET_NL }}
          BOL_CLIENT_ID: ${{ secrets.BOL_CLIENT_ID_NL }}
          BOL_CLIENT_SECRET: ${{ secrets.BOL_CLIENT_SECRET_NL }}
          WIJZIGINGEN: ${{ inputs.wijzigingen }}
        run: node src/prijs-aanpassen.js
      - name: Prijzen aanpassen BE
        if: ${{ github.event.inputs.land == 'BE' }}
        env:
          COUNTRY: BE
          BOL_CLIENT_ID_BE: ${{ secrets.BOL_CLIENT_ID_BE }}
          BOL_CLIENT_SECRET_BE: ${{ secrets.BOL_CLIENT_SECRET_BE }}
          WIJZIGINGEN: ${{ inputs.wijzigingen }}
        run: node src/prijs-aanpassen.js
